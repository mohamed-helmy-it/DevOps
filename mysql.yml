
---
- name: Install MySQL Database Server
  hosts: node1
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install MySQL Server
      ansible.builtin.apt:
        name: mysql-server
        state: present

    - name: Enable and start MySQL
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true
