---
- name: Install Java and Maven
  hosts: node2
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Java and Maven
      ansible.builtin.apt:
        name:
          - openjdk-17-jdk
          - maven
        state: present

    - name: Verify Java and Maven installation
      ansible.builtin.command: "{{ item }}"
      loop:
        - java -version
        - mvn -version
      changed_when: false
