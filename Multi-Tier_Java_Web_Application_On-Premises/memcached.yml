
---
- name: Install Memcached
  hosts: node1
  become: true

  tasks:
    - name: Install Memcached
      ansible.builtin.apt:
        name: memcached
        state: present
        update_cache: true

    - name: Enable and start Memcached
      ansible.builtin.service:
        name: memcached
        state: started
        enabled: true
