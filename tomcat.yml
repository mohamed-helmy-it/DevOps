---
- name: Install Tomcat
  hosts: node2
  become: true

  tasks:
    - name: Install Tomcat
      ansible.builtin.apt:
        name: tomcat10
        state: present
        update_cache: true

    - name: Enable and start Tomcat
      ansible.builtin.service:
        name: tomcat10
        state: started
        enabled: true
