services:
  db01:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: accounts
      MARIADB_USER: admin
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./vprofile-project/src/main/resources/db_backup.sql:/docker-entrypoint-initdb.d/db_backup.sql:ro

  mc01:
    image: memcached:1.6
    restart: unless-stopped

  rmq01:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD}

  app01:
    build:
      context: ./vprofile-project
      dockerfile: ../app/Dockerfile
    restart: unless-stopped
    depends_on:
      - db01
      - mc01
      - rmq01

  web01:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - app01
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  dbdata:
